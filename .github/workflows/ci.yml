name: ci

# 说明（写给第一次看这个文件的人）：
# * **两腿矩阵** = 2 平台 × 1 解释器（`3.12` 是项目底线，与 pyproject 的 `requires-python` 同一口径）。
#   为什么不再拉第二根解释器线：3.8 于 2024-10-07 EOL、3.9 于 2025-10-31、3.10 于 2026-10-01 EOL
#   （endoflife.date，2026-10-20 取），继续把老版本放进矩阵只是"能跑"，不是"受支持"；
#   3.12 的 EOL 是 2028-10-31，这条口径到 2028 之前不用再动。
#   随之**撤掉 `ubuntu-22.04` 那个钉**：它唯一的理由是"新镜像对 3.8 支持不稳"（见 plan/07 的 D5），
#   3.8 下线后这个理由不再成立；两条平台腿都用 `-latest`，"平台差异"与"接线缺陷"照样分得开。
# * 所有断言都落成 tools/ 下的脚本或 pytest，**不写内联 shell**：内联脚本受 shell/缩进/行尾影响，
#   本机无法复跑，而脚本形态可以（`python tools/ci_smoke.py` 就是本机同一条命令）。
# * PYTHONUTF8=1 是编码加固的第三层（第一层在程序入口 reconfigure，第二层在子进程显式 encoding）。
# * 里程碑落地时：同一次提交里改 tools/ci_smoke.py 的期望退出码。M5 起全部命令都已按真实值登记，
#   退出码 4「阶段未就绪」整项退役——README 退出码表只剩 0/1/2/3（`tests/test_smoke_coverage.py` 守着）。

on: [push, pull_request, workflow_dispatch]

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # 与 README 快速开始同一条 extras 集合（测试面 = 安装面 = 指令面）
      - name: 安装（editable + dev extras）
        run: python -m pip install -e ".[dev]"

      - name: 全量测试
        run: python -m pytest -q

      - name: 行尾卫生门
        run: python tools/fix_eol.py --check

      # 逐条跑"已交付命令"，断言退出码语义；含 console script 与 python -m 两种形态
      - name: 离线 CLI 冒烟
        run: python tools/ci_smoke.py

      # 安装面复核：离开仓库树（CWD 不在源码树内）时，口径文件必须靠随包副本定位得到
      - name: 安装面复核（中立 CWD）
        working-directory: ${{ runner.temp }}
        run: s2r selftest
