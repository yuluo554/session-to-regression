name: ci

# 说明（写给第一次看这个文件的人）：
# * 四腿矩阵 = 2 平台 × 2 解释器（3.8 是项目底线）。ubuntu 的 3.8 钉在 22.04 上——
#   新镜像对 3.8 的支持不稳定，而"平台差异"与"接线缺陷"必须能区分开（后者才是我们的问题）。
# * 所有断言都落成 tools/ 下的脚本或 pytest，**不写内联 shell**：内联脚本受 shell/缩进/行尾影响，
#   本机无法复跑，而脚本形态可以（`python tools/ci_smoke.py` 就是本机同一条命令）。
# * PYTHONUTF8=1 是编码加固的第三层（第一层在程序入口 reconfigure，第二层在子进程显式 encoding）。
# * 里程碑落地时：同一次提交里改 tools/ci_smoke.py 的期望退出码。M5 起全部命令都已按真实值登记，
#   退出码 4「阶段未就绪」整项退役——README 退出码表只剩 0/1/2/3（`tests/test_smoke_coverage.py` 守着）。

on: [push, pull_request, workflow_dispatch]

env:
  PYTHONUTF8: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.8" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 与 README 快速开始同一条 extras 集合（测试面 = 安装面 = 指令面）
      - name: 安装（editable + dev extras）
        run: python -m pip install -e ".[dev]"

      - name: 全量测试
        run: python -m pytest -q

      - name: 行尾卫生门
        run: python tools/fix_eol.py --check

      # 逐条跑"已交付命令"，断言退出码语义；含 console script 与 python -m 两种形态
      - name: 离线 CLI 冒烟
        run: python tools/ci_smoke.py

      # 安装面复核：离开仓库树（CWD 不在源码树内）时，口径文件必须靠随包副本定位得到
      - name: 安装面复核（中立 CWD）
        working-directory: ${{ runner.temp }}
        run: s2r selftest
